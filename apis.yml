name: LeapYear
description: 'LeapYear Technologies built an enterprise platform for differentially
  private analytics and machine learning, letting organizations run statistics, SQL-style
  queries, feature engineering, and supervised and unsupervised model training against
  their most sensitive data while a mathematically provable privacy guarantee bounds
  what any single record can leak. The product shipped as a self-hosted server, LeapYear
  Core, driven by a first-party Python client library that exposes databases, tables,
  views, users, groups, permissions, privacy profiles, and per-database privacy budgets
  as programmable resources. Snowflake announced its intent to acquire LeapYear in
  February 2023 and closed the acquisition for $62.0 million in cash, folding the
  differential privacy technology and team into the Snowflake Data Cloud clean-room
  capabilities. The standalone company surface is now retired: leapyear.io no longer
  answers on HTTPS. The surviving public developer surface is the hosted LeapYear
  Python client reference for version 4.1.1.'
