apis:
- aid: leapyear-python-client
  name: LeapYear Python Client
  description: 'The first-party Python client library for LeapYear Core. The Client
    class opens an authenticated connection to a self-hosted LeapYear server and exposes
    administrative resources (databases, tables, column definitions, views, users,
    groups, permissions, privacy profiles) alongside the DataSet query builder, the
    analytics and model modules for differentially private statistics and machine
    learning, feature transformers, and an async jobs interface. There is no public
    multi-tenant endpoint: every deployment runs its own LeapYear Core server, so
    the client is pointed at a customer-operated host via the url argument or the
    LY_API_URL environment variable.'
  humanURL: https://leapyear-python-docs.readthedocs-hosted.com/en/4.1.1/
